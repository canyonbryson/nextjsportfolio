<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="40" cy="115" rx="25" ry="5" fill="#1e293b" opacity="0.5"/>
  
  <!-- Legs -->
  <rect x="28" y="75" width="10" height="35" rx="3" fill="#3b82f6"/>
  <rect x="42" y="75" width="10" height="35" rx="3" fill="#3b82f6"/>
  
  <!-- Shoes -->
  <rect x="25" y="105" width="15" height="8" rx="3" fill="#1e40af"/>
  <rect x="40" y="105" width="15" height="8" rx="3" fill="#1e40af"/>
  
  <!-- Body / Hoodie -->
  <rect x="22" y="40" width="36" height="40" rx="5" fill="#6366f1"/>
  
  <!-- Hoodie detail -->
  <path d="M35 45 L40 55 L45 45" fill="none" stroke="#4f46e5" stroke-width="2"/>
  
  <!-- Hood -->
  <ellipse cx="40" cy="42" rx="12" ry="6" fill="#4f46e5"/>
  
  <!-- Arms -->
  <rect x="12" y="45" width="12" height="30" rx="4" fill="#6366f1"/>
  <rect x="56" y="45" width="12" height="30" rx="4" fill="#6366f1"/>
  
  <!-- Hands -->
  <circle cx="18" cy="78" r="6" fill="#fcd9b6"/>
  <circle cx="62" cy="78" r="6" fill="#fcd9b6"/>
  
  <!-- Laptop in hands -->
  <rect x="22" y="68" width="36" height="24" rx="3" fill="#374151"/>
  <rect x="24" y="70" width="32" height="18" rx="2" fill="#60a5fa"/>
  <!-- Code on screen -->
  <rect x="26" y="72" width="12" height="2" fill="#22c55e"/>
  <rect x="26" y="76" width="18" height="2" fill="#fcd34d"/>
  <rect x="26" y="80" width="8" height="2" fill="#f87171"/>
  <rect x="36" y="80" width="10" height="2" fill="#a78bfa"/>
  
  <!-- Head -->
  <ellipse cx="40" cy="25" rx="18" ry="20" fill="#fcd9b6"/>
  
  <!-- Hair (messy developer hair) -->
  <ellipse cx="40" cy="10" rx="16" ry="8" fill="#78350f"/>
  <circle cx="30" cy="8" r="5" fill="#78350f"/>
  <circle cx="50" cy="8" r="5" fill="#78350f"/>
  <circle cx="40" cy="5" r="6" fill="#78350f"/>
  
  <!-- Eyes (confident) -->
  <ellipse cx="33" cy="25" rx="3" ry="3" fill="#1e293b"/>
  <ellipse cx="47" cy="25" rx="3" ry="3" fill="#1e293b"/>
  <circle cx="34" cy="24" r="1.5" fill="#ffffff"/>
  <circle cx="48" cy="24" r="1.5" fill="#ffffff"/>
  
  <!-- Eyebrows (confident) -->
  <rect x="29" y="19" width="8" height="2" rx="1" fill="#78350f"/>
  <rect x="43" y="19" width="8" height="2" rx="1" fill="#78350f"/>
  
  <!-- Smile -->
  <path d="M34 33 Q40 38 46 33" stroke="#1e293b" stroke-width="2" fill="none"/>
  
  <!-- Coffee cup floating nearby -->
  <g transform="translate(60, 30)">
    <rect x="0" y="5" width="12" height="15" rx="2" fill="#fef3c7"/>
    <rect x="-2" y="5" width="16" height="3" rx="1" fill="#fef3c7"/>
    <path d="M12 8 Q16 10 12 15" stroke="#fef3c7" stroke-width="2" fill="none"/>
    <!-- Steam -->
    <path d="M4 2 Q5 0 6 2" stroke="#94a3b8" stroke-width="1" fill="none"/>
    <path d="M7 3 Q8 1 9 3" stroke="#94a3b8" stroke-width="1" fill="none"/>
  </g>
</svg>
