<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer glow -->
  <circle cx="50" cy="50" r="45" fill="#ef4444" opacity="0.2"/>
  <circle cx="50" cy="50" r="35" fill="#ef4444" opacity="0.3"/>
  <circle cx="50" cy="50" r="25" fill="#ef4444" opacity="0.4"/>
  
  <!-- Star burst -->
  <polygon points="50,5 55,40 90,35 60,50 90,65 55,60 50,95 45,60 10,65 40,50 10,35 45,40" fill="#fbbf24"/>
  
  <!-- Inner star -->
  <polygon points="50,20 53,42 75,38 56,50 75,62 53,58 50,80 47,58 25,62 44,50 25,38 47,42" fill="#fef3c7"/>
  
  <!-- Center flash -->
  <circle cx="50" cy="50" r="10" fill="#ffffff"/>
  
  <!-- Sparkles -->
  <circle cx="25" cy="25" r="3" fill="#ffffff"/>
  <circle cx="75" cy="25" r="2" fill="#ffffff"/>
  <circle cx="80" cy="70" r="3" fill="#ffffff"/>
  <circle cx="20" cy="75" r="2" fill="#ffffff"/>
</svg>
