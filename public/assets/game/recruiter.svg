<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" fill="none">
  <!-- Shadow -->
  <ellipse cx="40" cy="115" rx="25" ry="5" fill="#1e293b" opacity="0.5"/>
  
  <!-- Legs -->
  <rect x="28" y="75" width="10" height="35" rx="3" fill="#1e293b"/>
  <rect x="42" y="75" width="10" height="35" rx="3" fill="#1e293b"/>
  
  <!-- Shoes -->
  <rect x="25" y="105" width="15" height="8" rx="3" fill="#0f172a"/>
  <rect x="40" y="105" width="15" height="8" rx="3" fill="#0f172a"/>
  
  <!-- Body / Suit -->
  <rect x="22" y="40" width="36" height="40" rx="5" fill="#374151"/>
  
  <!-- Tie -->
  <polygon points="40,45 43,50 40,85 37,50" fill="#dc2626"/>
  
  <!-- Shirt collar -->
  <polygon points="32,45 40,55 48,45 48,50 40,60 32,50" fill="#f1f5f9"/>
  
  <!-- Arms -->
  <rect x="12" y="45" width="12" height="30" rx="4" fill="#374151"/>
  <rect x="56" y="45" width="12" height="30" rx="4" fill="#374151"/>
  
  <!-- Hands -->
  <circle cx="18" cy="78" r="6" fill="#fcd9b6"/>
  <circle cx="62" cy="78" r="6" fill="#fcd9b6"/>
  
  <!-- Head -->
  <ellipse cx="40" cy="25" rx="18" ry="20" fill="#fcd9b6"/>
  
  <!-- Hair -->
  <ellipse cx="40" cy="12" rx="16" ry="8" fill="#374151"/>
  <rect x="24" y="8" width="32" height="10" rx="5" fill="#374151"/>
  
  <!-- Eyes -->
  <ellipse cx="33" cy="25" rx="3" ry="4" fill="#1e293b"/>
  <ellipse cx="47" cy="25" rx="3" ry="4" fill="#1e293b"/>
  <circle cx="34" cy="24" r="1" fill="#ffffff"/>
  <circle cx="48" cy="24" r="1" fill="#ffffff"/>
  
  <!-- Eyebrows (stern) -->
  <rect x="29" y="18" width="10" height="2" rx="1" fill="#374151" transform="rotate(-10, 34, 19)"/>
  <rect x="41" y="18" width="10" height="2" rx="1" fill="#374151" transform="rotate(10, 46, 19)"/>
  
  <!-- Mouth (slight frown) -->
  <path d="M35 33 Q40 31 45 33" stroke="#94a3b8" stroke-width="2" fill="none"/>
  
  <!-- Glasses -->
  <rect x="27" y="21" width="12" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <rect x="41" y="21" width="12" height="10" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="39" y1="26" x2="41" y2="26" stroke="#64748b" stroke-width="1.5"/>
</svg>
